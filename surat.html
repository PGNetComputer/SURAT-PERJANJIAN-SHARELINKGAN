<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Persetujuan Keluarga · PGNet</title>
<meta name="theme-color" content="#188038">
<link rel="icon" href="logo.png">
<style>
:root{--g:#188038;--gd:#0f5c27;--bg:#eef1ef;--card:#fff;--line:#d9dfdb;--muted:#5d6862;--fg:#1d2420;--soft:#e8ece9;--gs:#e6f4ea;--warn:#8a5a00;--warnbg:#fff4d6;--bad:#b42318;--badbg:#fdecea;--f:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--g:#34a853;--gd:#81c995;--bg:#121614;--card:#1c231f;--line:#334039;--muted:#a3ada7;--fg:#e8eee9;--soft:#27302b;--gs:#1f3326;--warn:#f2c46b;--warnbg:#3a2f12;--bad:#f59b91;--badbg:#3b1d1a;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--f);padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;justify-content:space-between;align-items:center;color:var(--g);font-weight:800;font-size:17px}
.brand small{color:var(--muted);font-weight:500;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;margin:0;line-height:1.3}
h2{font-size:17px;margin:4px 0 0}
.muted{color:var(--muted);font-size:14.5px;margin:0}
ol{margin:0;padding-left:22px}li{margin:7px 0}
.box{background:var(--soft);border-radius:12px;padding:11px 13px;font-size:15px}
.pk{background:var(--gs);border-radius:12px;padding:11px 13px;font-size:15px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted)}
input,select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:11px;padding:12px;font:16px var(--f)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.btn{border:0;border-radius:13px;padding:14px;font:700 16px var(--f);cursor:pointer;background:var(--g);color:#fff;width:100%}
.btn.ghost{background:var(--soft);color:var(--fg)}
.btn.wa{background:#1fa855}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--g);flex:none;margin-top:2px;padding:0}
.pad{position:relative;border:1.5px dashed var(--g);border-radius:12px;background:#fff;height:190px;touch-action:none;-webkit-user-select:none;user-select:none}
.pad canvas{width:100%;height:100%;display:block;border-radius:12px;touch-action:none}
.pad .ph{position:absolute;inset:0;display:grid;place-items:center;color:#9aa49e;font-size:15px;pointer-events:none}
.padbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.link{border:0;background:none;color:var(--g);font:600 14px var(--f);text-decoration:underline;cursor:pointer;padding:0}
.steps{display:flex;gap:6px}.steps span{flex:1;height:4px;border-radius:99px;background:var(--soft)}.steps span.on{background:var(--g)}
.ok{background:var(--gs);color:var(--gd);border-radius:12px;padding:11px 13px;font-weight:600}
.err{background:var(--badbg);color:var(--bad);border-radius:12px;padding:11px 13px;font-size:14.5px}
.bubble{background:#d9fdd3;color:#111;border-radius:12px;padding:10px 12px;font-size:14.5px}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">PGNet Computer <small>Program SHARELINKGAN</small></div>
  <div id="app"><div class="card"><p class="muted">Memuat…</p></div></div>
</div>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var API_URL=window.SLG_API||'';
var WA_PGNET='6289605345210',KOTA='Citeureup',TTD_PGNET='Agda Purnama';
var KLAUSUL=[
 'Saya mengetahui risikonya: barang komputer bekas rawan berasal dari pencurian, dan pembelinya bisa dimintai keterangan atau diperiksa oleh pihak berwajib.',
 'Tidak akan membeli barang yang patut diduga hasil pencurian, penggelapan, atau penipuan. Saya paham hal itu termasuk tindak pidana penadahan, walaupun dibeli lewat marketplace.',
 'Tidak melanjutkan pembelian dan melapor ke admin PGNet bila ada tanda mencurigakan: harga jauh di bawah pasaran, ada stiker inventaris/aset instansi, nomor seri dihapus, atau penjual tidak jelas asal barangnya.',
 'Setiap pembelian dicatat di aplikasi SHARELINKGAN dengan invoice/bukti yang benar, dan tidak melakukan COD atau ambil barang langsung tanpa izin.',
 'Segera melapor bila ada kecurigaan, dan bersedia memberi keterangan jujur bila ada pemeriksaan pihak berwajib.'];
var KOMITMEN='Bila timbul masalah hukum dari pembelian yang dilakukan untuk PGNet, termasuk karena kesalahan pembelian, PGNet Computer akan mendampingi Karyawan dan menanggung 75% dari biaya yang timbul (biaya pendampingan hukum dan ganti rugi kepada pemilik barang). Sisanya 25% ditanggung Karyawan. Komitmen ini berlaku selama Karyawan jujur dan terbuka, dan tidak berlaku bila Karyawan terbukti sengaja bekerja sama dengan pelaku kejahatan.';
var PERSETUJUAN='Saya, istri / orang tua Karyawan, sudah membaca surat ini, menyetujui Karyawan bekerja sebagai pencari barang bekas untuk PGNet, dan akan ikut mengingatkannya.';
var BL=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function LSget(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(_){return null;}}
function LSset(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(_){}}
function dec(s){try{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))));}catch(_){return null;}}
function stamp(d){d=d||new Date();var p=function(n){return ('0'+n).slice(-2);};return d.getDate()+' '+BL[d.getMonth()]+' '+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());}
function waNum(s){s=String(s||'').replace(/[^\d]/g,'');if(s.indexOf('0')===0)s='62'+s.slice(1);return s;}

/* ---------- data dari link ---------- */
if(!/^https:\/\/script\.google\.com\//.test(API_URL)){$('app').innerHTML='<div class="card"><h1>Belum disetel</h1><p class="muted">Alamat server belum diisi di file config.js.</p></div>';throw new Error('config');}
var AGNO=(location.search.match(/[?&]agda=(SP-SLG-\d{8}-[A-Z0-9]{4})/)||[])[1]||'';   // link TTD Agda
var D=AGNO?null:dec((location.hash.match(/[#&]d=([^&]+)/)||[])[1]||'');
if(!AGNO&&(!D||!D.n||!/^SP-SLG-\d{8}-[A-Z0-9]{4}$/.test(D.no||''))){
  $('app').innerHTML='<div class="card"><h1>Link tidak lengkap</h1><p class="muted">Link surat ini rusak atau terpotong. Mohon minta link baru ke PGNet Computer.</p></div>';
  throw new Error('link');
}
var KEY=D?'slg_'+D.no:'';
var ST=(KEY&&LSget(KEY))||{step:0,nama:'',hub:'',hp:(D&&D.k)||'',sig:null,at:'',url:'',sent:false};
function agdaLink(no){return location.href.replace(/[#?].*$/,'')+'?agda='+no;}
function save(){LSset(KEY,ST);}

/* ---------- layar ---------- */
function render(){
  var h;
  if(ST.step===0){
    h='<div class="card"><div class="steps"><span class="on"></span><span></span></div>'+
     '<h1>Persetujuan keluarga</h1><p class="muted"><b style="color:var(--fg)">'+esc(D.n)+'</b> akan bekerja sebagai pencari barang komputer bekas untuk PGNet Computer. Mohon baca poin-poin di bawah, lalu isi data dan tanda tangan.</p>'+
     '<p class="muted"><b style="color:var(--fg)">'+esc(D.n)+'</b>, sebagai pencari barang untuk PGNet Computer, menyatakan:</p>'+
     '<ol>'+KLAUSUL.map(function(k){return '<li>'+esc(k)+'</li>';}).join('')+'</ol>'+
     '<div class="box"><b>Komitmen PGNet Computer.</b> '+esc(KOMITMEN)+'</div>'+
     '<div class="pk"><b>Persetujuan keluarga.</b> '+esc(PERSETUJUAN)+'</div>'+
     '<h2>Data Anda</h2>'+
     '<label class="f">Nama lengkap<input id="fNm" autocomplete="name" value="'+esc(ST.nama)+'"></label>'+
     '<label class="f">Hubungan dengan '+esc(D.n)+'<select id="fHb"><option value="">— pilih —</option>'+['Istri','Ibu','Ayah','Orang tua / wali'].map(function(x){return '<option'+(ST.hub===x?' selected':'')+'>'+x+'</option>';}).join('')+'</select></label>'+
     '<label class="f">No. HP / WhatsApp<input id="fHp" inputmode="tel" autocomplete="tel" value="'+esc(ST.hp)+'"></label>'+
     '<div id="e0"></div><button type="button" class="btn" id="go1">Lanjut</button></div>';
  }else if(ST.step===1){
    h='<div class="card"><div class="steps"><span class="on"></span><span class="on"></span></div><h1>Tanda tangan</h1>'+
     '<label class="chk"><input type="checkbox" id="fOk"><span>Saya, '+esc(ST.nama)+' ('+esc(ST.hub.toLowerCase())+'), sudah membaca surat ini, menyetujui '+esc(D.n)+' bekerja sebagai pencari barang bekas untuk PGNet, dan akan ikut mengingatkannya.</span></label>'+
     '<div><div class="padbar"><span>Tanda tangan di kotak ini</span><button type="button" class="link" id="padX">Ulangi</button></div><div class="pad" id="pad"><canvas></canvas><div class="ph">✍️ Tanda tangan dengan jari</div></div></div>'+
     '<div class="btns"><button type="button" class="btn ghost" id="back">Kembali</button><button type="button" class="btn" id="go2" disabled>Tanda tangan</button></div></div>';
  }else{
    var msg=pesan(true);
    h='<div class="card"><div class="ok">✓ Terima kasih, '+esc(ST.nama)+'. Tanda tangan Anda sudah masuk ke surat.</div>'+
     '<p class="muted">Ketuk <b>Selesai</b>, WhatsApp Anda akan terbuka ke PGNet. Tinggal ketuk kirim.</p>'+
     '<div class="bubble">'+esc(msg).replace(/\n/g,'<br>')+'</div>'+
     '<div id="e2"></div>'+
     '<button type="button" class="btn wa" id="done">'+(ST.sent?'✓ Selesai — buka WA lagi':'Selesai')+'</button>'+
     '<button type="button" class="btn ghost" id="share">Bagikan / simpan file PDF</button>'+
     '<button type="button" class="link" id="redo" style="align-self:center">Ada yang salah? Ulangi tanda tangan</button></div>';
  }
  $('app').innerHTML=h;bind();window.scrollTo(0,0);
}
function pesan(pre){return 'Saya '+ST.nama+' ('+ST.hub.toLowerCase()+' '+D.n+') sudah tanda tangan Surat Pernyataan SHARELINKGAN.'+(ST.url?'\n\nPDF surat: '+ST.url:pre?'\n\nPDF surat: (link dibuat otomatis)':'')+'\n\nLink TTD Agda: '+agdaLink(D.no)+'\n\nNo. '+D.no;}
function fileBase(){return D.n.replace(/[^A-Za-z0-9 ]/g,'').trim().replace(/\s+/g,'-')+'-'+D.no;}

function bind(){
  if($('go1'))$('go1').onclick=function(){
    ST.nama=$('fNm').value.trim();ST.hub=$('fHb').value;ST.hp=$('fHp').value.trim();
    if(!ST.nama||!ST.hub||ST.hp.replace(/[^\d]/g,'').length<9){$('e0').innerHTML='<div class="err">Lengkapi nama lengkap, hubungan, dan no. HP.</div>';return;}
    ST.step=1;save();render();};
  if($('pad')){
    var P=pad($('pad'));
    function upd(){$('go2').disabled=!(P.has()&&$('fOk').checked);}
    $('pad').addEventListener('change',upd);$('fOk').onchange=upd;$('padX').onclick=P.clear;
    $('back').onclick=function(){ST.step=0;save();render();};
    $('go2').onclick=function(){ST.sig=P.data();ST.at=stamp();ST.url='';ST.sent=false;ST.step=2;save();render();};
  }
  if($('done'))$('done').onclick=selesai;
  if($('share'))$('share').onclick=bagikan;
  if($('redo'))$('redo').onclick=function(){ST.step=1;ST.sig=null;ST.url='';ST.sent=false;save();render();};
}

/* ---------- Selesai: simpan PDF ke Drive PGNet, lalu buka WA ke PGNet ---------- */
var PDF_BLOB=null;
function getPdf(){if(!PDF_BLOB)PDF_BLOB=buildPdf().output('blob');return PDF_BLOB;}
function toB64(blob){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(String(r.result).split(',')[1]);};r.onerror=no;r.readAsDataURL(blob);});}
function bukaWA(){location.href='https://wa.me/'+WA_PGNET+'?text='+encodeURIComponent(pesan());}
function selesai(){
  var b=$('done');
  if(ST.url){ST.sent=true;save();bukaWA();return;}
  b.disabled=true;b.innerHTML='<span class="spin"></span>Menyiapkan surat…';
  var blob;try{blob=getPdf();}catch(e){$('e2').innerHTML='<div class="err">Gagal membuat PDF. Muat ulang halaman lalu coba lagi.</div>';b.disabled=false;b.textContent='Selesai';return;}
  toB64(blob).then(function(b64){
    return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',
      body:JSON.stringify({fn:'uploadSurat',args:[{no:D.no,karyawan:D.n,keluarga:ST.nama,hub:ST.hub,at:ST.at},b64,{d:D,nama:ST.nama,hub:ST.hub,hp:ST.hp,at:ST.at,sig:ST.sig,sw:ST.sw,sh:ST.sh}]})}).then(function(r){return r.json();});
  }).then(function(j){
    if(!j.ok)throw new Error(j.error||'Gagal');
    ST.url=j.result.url;ST.sent=true;save();bukaWA();
    setTimeout(render,800);
  }).catch(function(e){
    // tanpa internet / server gagal: tetap buka WA ke PGNet, file dikirim lewat tombol Bagikan
    b.disabled=false;b.textContent='Selesai';
    $('e2').innerHTML='<div class="err">Surat belum terunggah ('+esc(e.message||e)+'). Ketuk <b>Bagikan / simpan file PDF</b>, pilih WhatsApp → PGNet, lalu kirim.</div>';
  });
}
function bagikan(){
  var blob;try{blob=getPdf();}catch(e){return;}
  var name='Surat-SHARELINKGAN-'+fileBase()+'.pdf',file;
  try{file=new File([blob],name,{type:'application/pdf'});}catch(_){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],text:pesan()}).catch(function(){});return;
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);
}

/* ---------- pad tanda tangan (HP: sentuh; laptop: mouse) ---------- */
function pad(wrap){
  var c=wrap.querySelector('canvas'),ctx,drawing=false,has=false,last=null,ph=wrap.querySelector('.ph');
  var r=c.getBoundingClientRect(),dpr=Math.max(2,window.devicePixelRatio||1);
  c.width=r.width*dpr;c.height=r.height*dpr;ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
  function pt(e){var b=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return {x:t.clientX-b.left,y:t.clientY-b.top};}
  function start(e){e.preventDefault();drawing=true;last=pt(e);ctx.beginPath();ctx.arc(last.x,last.y,1.2,0,7);ctx.fillStyle='#111';ctx.fill();if(!has){has=true;ph.hidden=true;wrap.dispatchEvent(new Event('change'));}}
  function move(e){if(!drawing)return;e.preventDefault();var p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;}
  function end(){drawing=false;}
  c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',end);c.addEventListener('touchcancel',end);
  if(!('ontouchstart' in window)){c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);window.addEventListener('pointerup',end);}
  return {has:function(){return has;},clear:function(){ctx.clearRect(0,0,c.width,c.height);has=false;ph.hidden=false;wrap.dispatchEvent(new Event('change'));},
    data:function(){var o=trim(c);window._lastW=o.width;window._lastH=o.height;if(!AGNO){ST.sw=o.width;ST.sh=o.height;}return o.toDataURL('image/png');}};
}
// potong area kosong di sekitar tanda tangan
function trim(c){
  var x=c.getContext('2d'),w=c.width,h=c.height,d=x.getImageData(0,0,w,h).data,t=h,l=w,b=0,r=0;
  for(var y=0;y<h;y++)for(var i=0;i<w;i++){if(d[(y*w+i)*4+3]>10){if(y<t)t=y;if(y>b)b=y;if(i<l)l=i;if(i>r)r=i;}}
  if(r<=l||b<=t)return c;
  var m=8,o=document.createElement('canvas');o.width=r-l+2*m;o.height=b-t+2*m;o.getContext('2d').drawImage(c,l-m,t-m,o.width,o.height,0,0,o.width,o.height);
  return o;

  .then(function(r){return r.json();},function(){throw new Error('Tidak ada koneksi. Cek internet lalu coba lagi.');}).then(function(j){if(!j.ok)throw new Error(j.error||'Gagal');return j.result;});}
function agdaPin(){try{return localStorage.getItem('slg_agda_pin')||'';}catch(_){return '';}}
function card(h){$('app').innerHTML='<div class="card">'+h+'</div>';window.scrollTo(0,0);}
function agdaLogin(msg){
  card('<h1>Tanda tangan PGNet</h1><p class="muted">Surat '+esc(AGNO)+'. Masuk dengan password Agda.</p>'+
    (msg?'<div class="err">'+esc(msg)+'</div>':'')+'<label class="f">Password Agda<input id="agPw" type="password" autocomplete="current-password"></label><button type="button" class="btn" id="agIn">Masuk</button>');
  $('agIn').onclick=function(){var v=$('agPw').value.trim();if(!v)return;AG.pin=v;agdaLoad();};
  $('agPw').onkeydown=function(e){if(e.key==='Enter')$('agIn').click();};
}
function agdaLoad(){
  card('<p class="muted">Memuat surat…</p>');
  api('getSurat',[AG.pin,AGNO]).then(function(d){
    try{localStorage.setItem('slg_agda_pin',AG.pin);}catch(_){}
    D=d.d;ST=d.kel;
    if(d.agda&&d.agda.url){AG.url=d.agda.url;AG.at=d.agda.at;agdaDone();}else agdaSign();
  },function(e){
    if(/password/i.test(e.message)){try{localStorage.removeItem('slg_agda_pin');}catch(_){}agdaLogin(e.message);}
    else{try{localStorage.setItem('slg_agda_pin',AG.pin);}catch(_){}card('<h1>Belum bisa dibuka</h1><div class="err">'+esc(e.message)+'</div><button type="button" class="btn" onclick="agdaLoad()">Coba lagi</button>');}
  });
}
function agdaSign(){
  var simpan=LSget('slg_agda_sig');
  card('<h1>Tanda tangan PGNet</h1>'+
    '<div class="box"><b>'+esc(D.n)+'</b> · karyawan pencari barang<br><span class="muted">'+esc(AGNO)+'</span></div>'+
    '<div class="ok">✓ '+esc(ST.nama)+' ('+esc(String(ST.hub).toLowerCase())+') sudah tanda tangan · '+esc(ST.at)+'</div>'+
    '<div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center"><img src="'+ST.sig+'" alt="Tanda tangan istri / orang tua" style="max-height:70px;max-width:100%"></div>'+
    '<label class="chk"><input type="checkbox" id="agOk"><span>Saya, '+esc(TTD_PGNET)+', menandatangani surat ini atas nama PGNet Computer.</span></label>'+
    (simpan?'<div id="agSaved"><div class="padbar"><span>Tanda tangan tersimpan</span><button type="button" class="link" id="agNew">Gambar ulang</button></div><div style="background:#fff;border:1.5px solid var(--g);border-radius:12px;padding:10px;text-align:center"><img src="'+simpan.sig+'" alt="Tanda tangan Agda" style="max-height:80px;max-width:100%"></div></div>':'')+
    '<div id="agPadW"'+(simpan?' hidden':'')+'><div class="padbar"><span>Tanda tangan di kotak ini</span><button type="button" class="link" id="padX">Ulangi</button></div><div class="pad" id="pad"><canvas></canvas><div class="ph">✍️ Tanda tangan dengan jari</div></div></div>'+
    '<div id="e3"></div><button type="button" class="btn" id="agGo" disabled>Tanda tangan &amp; Selesai</button>');
  var P=null,pakai=!!simpan;
  function upd(){$('agGo').disabled=!($('agOk').checked&&(pakai||(P&&P.has())));}
  function bukaPad(){$('agPadW').hidden=false;if(!P){P=pad($('pad'));$('pad').addEventListener('change',upd);$('padX').onclick=P.clear;}}
  if(!simpan)bukaPad();
  if($('agNew'))$('agNew').onclick=function(){pakai=false;$('agSaved').hidden=true;bukaPad();upd();};
  $('agOk').onchange=upd;
  $('agGo').onclick=function(){
    var b=this;b.disabled=true;b.innerHTML='<span class="spin"></span>Menyimpan…';
    if(pakai){AG.sig=simpan.sig;AG.sw=simpan.sw;AG.sh=simpan.sh;}else{AG.sig=P.data();AG.sw=window._lastW;AG.sh=window._lastH;}
    AG.at=stamp();
    var blob;try{blob=buildPdf(AG).output('blob');}catch(e){$('e3').innerHTML='<div class="err">Gagal membuat PDF.</div>';b.disabled=false;b.textContent='Tanda tangan & Selesai';return;}
    AG.blob=blob;
    toB64(blob).then(function(b64){return api('ttdAgda',[AG.pin,AGNO,{sig:AG.sig,sw:AG.sw,sh:AG.sh,at:AG.at},b64]);}).then(function(r){
      AG.url=r.url;LSset('slg_agda_sig',{sig:AG.sig,sw:AG.sw,sh:AG.sh});agdaDone();
    },function(e){$('e3').innerHTML='<div class="err">'+esc(e.message)+'</div>';b.disabled=false;b.textContent='Tanda tangan & Selesai';});
  };
}
function agdaDone(){
  var txt='Surat Pernyataan SHARELINKGAN '+D.n+' sudah ditandatangani '+TTD_PGNET+' (PGNet). Siap dicetak, lalu karyawan tanda tangan di atas meterai.\n\nPDF lengkap: '+AG.url+'\n\nNo. '+AGNO;
  card('<div class="ok">✓ Surat '+esc(D.n)+' sudah ditandatangani PGNet'+(AG.at?' · '+esc(AG.at):'')+'</div>'+
    '<p class="muted">Langkah terakhir: cetak PDF lengkap, lalu karyawan tanda tangan di atas meterai Rp10.000 (rangkap 2).</p>'+
    '<a class="btn" style="display:block;text-align:center;text-decoration:none" href="'+esc(AG.url)+'" target="_blank" rel="noopener">Buka PDF lengkap</a>'+
    '<button type="button" class="btn wa" id="agWa">Kirim ke WA PGNet</button>'+
    (AG.blob?'<button type="button" class="btn ghost" id="agShare">Bagikan / simpan file PDF</button>':''));
  $('agWa').onclick=function(){location.href='https://wa.me/'+WA_PGNET+'?text='+encodeURIComponent(txt);};
  if($('agShare'))$('agShare').onclick=function(){var name='Surat-SHARELINKGAN-'+fileBase()+'-LENGKAP.pdf',file;try{file=new File([AG.blob],name,{type:'application/pdf'});}catch(_){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(function(){});return;}
    var a=document.createElement('a');a.href=URL.createObjectURL(AG.blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},2000);};
}

if(AGNO){AG.pin=agdaPin();if(AG.pin)agdaLoad();else agdaLogin();}
else{
  if(ST.step===1&&!ST.nama)ST.step=0;
  if(ST.step===2&&!ST.sig)ST.step=1;
  render();
}
</script>
</body>
</html>
